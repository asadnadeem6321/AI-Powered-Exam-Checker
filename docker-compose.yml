version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15
    container_name: exam_checker_db
    environment:
      POSTGRES_DB: exam_checker_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - exam_checker_network

  # Redis for Celery
  redis:
    image: redis:7-alpine
    container_name: exam_checker_redis
    ports:
      - "6379:6379"
    networks:
      - exam_checker_network

  # Django Web Application
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: exam_checker_web
    command: gunicorn --bind 0.0.0.0:8000 --workers 4 --timeout 300 exam_checker.wsgi:application
    volumes:
      - .:/app
      - media_volume:/app/media
      - static_volume:/app/staticfiles
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - SECRET_KEY=your-secret-key-here
      - DB_NAME=exam_checker_db
      - DB_USER=postgres
      - DB_PASSWORD=postgres123
      - DB_HOST=db
      - DB_PORT=5432
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      - db
      - redis
    networks:
      - exam_checker_network

  # Celery Worker
  celery:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: exam_checker_celery
    command: celery -A exam_checker worker --loglevel=info
    volumes:
      - .:/app
      - media_volume:/app/media
    environment:
      - DEBUG=True
      - SECRET_KEY=your-secret-key-here
      - DB_NAME=exam_checker_db
      - DB_USER=postgres
      - DB_PASSWORD=postgres123
      - DB_HOST=db
      - DB_PORT=5432
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      - db
      - redis
      - web
    networks:
      - exam_checker_network

  # Celery Beat (for periodic tasks)
  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: exam_checker_celery_beat
    command: celery -A exam_checker beat --loglevel=info
    volumes:
      - .:/app
    environment:
      - DEBUG=True
      - SECRET_KEY=your-secret-key-here
      - DB_NAME=exam_checker_db
      - DB_USER=postgres
      - DB_PASSWORD=postgres123
      - DB_HOST=db
      - DB_PORT=5432
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      - db
      - redis
      - web
    networks:
      - exam_checker_network

  # Nginx (Optional - for production)
  # nginx:
  #   image: nginx:alpine
  #   container_name: exam_checker_nginx
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/nginx.conf
  #     - static_volume:/app/staticfiles
  #     - media_volume:/app/media
  #   ports:
  #     - "80:80"
  #   depends_on:
  #     - web
  #   networks:
  #     - exam_checker_network

volumes:
  postgres_data:
  media_volume:
  static_volume:

networks:
  exam_checker_network:
    driver: bridge
